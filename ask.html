<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>問答｜年齡與憂鬱、焦慮、壓力的關係</title>
<link rel="stylesheet" href="style.css">
<style>
.conn{margin-top:28px}
.conn button+button{margin-left:8px}
.conn button{font:inherit;font-size:15px;padding:9px 20px;border:1.5px solid var(--ink);border-radius:8px;background:var(--ink);color:#fff;cursor:pointer}
.conn button:disabled{opacity:.6;cursor:wait}
.conn button:focus-visible{outline:3px solid #7aa2f7;outline-offset:2px}
.conn .out{margin:14px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:14px;white-space:pre-wrap;word-break:break-word;min-height:1em}
.conn .out.err{border-color:#cf5440;background:#fdf1ef;color:#8a2a1c}
.conn .out[hidden]{display:none}
</style>
</head>
<body>
<nav class="site-nav" aria-label="主要導覽">
  <div class="in">
    <a class="brand" href="index.html">DASS 年齡分析</a>
    <ul><li><a class="link" href="index.html">首頁</a></li><li><a class="link" href="results.html">研究結果</a></li><li><a class="link" href="ask.html" aria-current="page">問答</a></li><li><a class="link" href="about.html">關於研究</a></li></ul>
  </div>
</nav>
<main>
  <h1 class="page-title">問答</h1>
  <div class="soon">
    <span class="tag">即將推出</span>
    <p>問答功能正在準備中，敬請期待。</p>
  </div>

  <div class="conn">
    <button type="button" id="testBtn">測試連線</button>
    <button type="button" id="geminiBtn">測試 Gemini</button>
    <pre class="out" id="testOut" role="status" aria-live="polite" hidden></pre>
  </div>
</main>
<footer class="site-foot">
  <div class="in">
    <span>組別：第 ＿＿ 組</span>
    <span>組員：＿＿＿＿、＿＿＿＿、＿＿＿＿</span>
  </div>
</footer>

<script>
(function(){
  const API_URL = "https://aged-field.c44136049.workers.dev/";
  const testBtn = document.getElementById("testBtn");
  const geminiBtn = document.getElementById("geminiBtn");
  const out = document.getElementById("testOut");

  function show(text, isError){
    out.hidden = false;
    out.textContent = text;
    out.classList.toggle("err", !!isError);
  }

  // 送出 POST JSON 給後端；成功時把回應資料交給 onOk 轉成要顯示的文字
  async function callApi(payload, onOk){
    testBtn.disabled = true;
    geminiBtn.disabled = true;
    show("連線中…", false);
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
      });
      const raw = await res.text();
      let data = null;
      try { data = JSON.parse(raw); } catch (e) {}

      if (!res.ok) {
        const msg = data && data.error ? data.error : (raw || "沒有回應內容");
        show("連線失敗（狀態碼 " + res.status + "）：" + msg, true);
      } else if (data === null) {
        show("連線成功，但回應不是 JSON：" + raw, true);
      } else {
        onOk(data);
      }
    } catch (e) {
      show("無法連線到後端：" + e.message + "\n請確認網路連線與後端網址是否正確。", true);
    } finally {
      testBtn.disabled = false;
      geminiBtn.disabled = false;
    }
  }

  testBtn.addEventListener("click", function(){
    callApi({action: "test"}, function(data){
      show(JSON.stringify(data, null, 2), false);
    });
  });

  geminiBtn.addEventListener("click", function(){
    callApi({action: "ask", question: "請用一句話自我介紹"}, function(data){
      if (typeof data.answer === "string" && data.answer) show(data.answer, false);
      else show("後端回應中沒有 Gemini 的回覆文字：" + JSON.stringify(data), true);
    });
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>問答｜年齡與憂鬱、焦慮、壓力的關係</title>
<link rel="stylesheet" href="style.css">
<style>
.qa{margin-top:24px}
.qa label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.qa-row{display:flex;flex-wrap:wrap;gap:8px}
.qa input{flex:1 1 280px;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.qa input:focus-visible{outline:3px solid #7aa2f7;outline-offset:1px;border-color:var(--ink)}
.conn{margin-top:28px}
.qa button,.conn button{font:inherit;font-size:15px;padding:9px 20px;border:1.5px solid var(--ink);border-radius:8px;background:var(--ink);color:#fff;cursor:pointer}
.qa button:disabled,.conn button:disabled,.qa input:disabled{opacity:.6;cursor:wait}
.qa button:focus-visible,.conn button:focus-visible{outline:3px solid #7aa2f7;outline-offset:2px}
.out{margin:14px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:15px;white-space:pre-wrap;word-break:break-word;font-family:inherit}
.out.err{border-color:#cf5440;background:#fdf1ef;color:#8a2a1c}
.out[hidden]{display:none}
.conn .out{font-size:14px}
</style>
</head>
<body>
<nav class="site-nav" aria-label="主要導覽">
  <div class="in">
    <a class="brand" href="index.html">DASS 年齡分析</a>
    <ul><li><a class="link" href="index.html">首頁</a></li><li><a class="link" href="results.html">研究結果</a></li><li><a class="link" href="ask.html" aria-current="page">問答</a></li><li><a class="link" href="about.html">關於研究</a></li></ul>
  </div>
</nav>
<main>
  <h1 class="page-title">問答</h1>

  <form class="qa" id="qaForm">
    <label for="qInput">請輸入關於研究結果的問題</label>
    <div class="qa-row">
      <input id="qInput" type="text" maxlength="500" autocomplete="off" placeholder="例如：20–29 歲組的焦慮平均數是多少？" required>
      <button type="submit" id="qBtn">送出</button>
    </div>
  </form>
  <div class="out" id="qaOut" role="status" aria-live="polite" hidden></div>

  <div class="conn">
    <button type="button" id="testBtn">測試連線</button>
    <pre class="out" id="testOut" role="status" aria-live="polite" hidden></pre>
  </div>
</main>
<footer class="site-foot">
  <div class="in">
    <span>組別：第 ＿＿ 組</span>
    <span>組員：＿＿＿＿、＿＿＿＿、＿＿＿＿</span>
  </div>
</footer>

<script>
(function(){
  const API_URL = "https://aged-field.c44136049.workers.dev/";

  // 送出 POST JSON 給後端，回傳 {ok, status, data, error}，不會丟出例外
  async function callApi(payload){
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
      });
      const raw = await res.text();
      let data = null;
      try { data = JSON.parse(raw); } catch (e) {}
      if (!res.ok) {
        const msg = data && data.error ? data.error : (raw || "沒有回應內容");
        return {ok: false, error: "連線失敗（狀態碼 " + res.status + "）：" + msg};
      }
      if (data === null) return {ok: false, error: "連線成功，但回應不是 JSON：" + raw};
      return {ok: true, data: data};
    } catch (e) {
      return {ok: false, error: "無法連線到後端：" + e.message + "\n請確認網路連線與後端網址是否正確。"};
    }
  }

  function show(el, text, isError){
    el.hidden = false;
    el.textContent = text;
    el.classList.toggle("err", !!isError);
  }

  // ---- 問答 ----
  const form = document.getElementById("qaForm");
  const input = document.getElementById("qInput");
  const qBtn = document.getElementById("qBtn");
  const qaOut = document.getElementById("qaOut");

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    input.disabled = true;
    qBtn.disabled = true;
    show(qaOut, "回答中…", false);
    const r = await callApi({action: "ask", question: question});
    if (!r.ok) show(qaOut, r.error, true);
    else if (typeof r.data.answer === "string" && r.data.answer) show(qaOut, r.data.answer, false);
    else show(qaOut, "後端回應中沒有回答內容。", true);
    input.disabled = false;
    qBtn.disabled = false;
    input.focus();
  });

  // ---- 測試連線 ----
  const testBtn = document.getElementById("testBtn");
  const testOut = document.getElementById("testOut");
  testBtn.addEventListener("click", async function(){
    testBtn.disabled = true;
    show(testOut, "連線中…", false);
    const r = await callApi({action: "test"});
    if (r.ok) show(testOut, JSON.stringify(r.data, null, 2), false);
    else show(testOut, r.error, true);
    testBtn.disabled = false;
  });
})();
</script>
</body>
</html>

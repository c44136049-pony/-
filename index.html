<main>
  <h1 class="page-title">年齡與憂鬱、焦慮、壓力的關係</h1>
  <p class="intro">本研究使用線上版 DASS-42 問卷資料，依年齡分層，比較不同年齡組在憂鬱、焦慮與壓力三個分量表上的平均分數與嚴重度分布。</p>

  <div class="stats" id="stats" aria-label="重點數字"></div>

  <section class="section">
    <h2>前往各頁</h2>
    <div class="entries">
      <a class="entry" href="results.html"><b>研究結果</b><span>平均數圖表、嚴重度分布與統計表格</span></a>

    </div>
  </section>
</main>
<footer class="site-foot">
  <div class="in">
    <span>組別：第 ＿＿ 組</span>
    <span>組員：＿＿＿＿、＿＿＿＿、＿＿＿＿</span>
  </div>
</footer>
<script src="data.js"></script>
<script>
(function(){
  const g=DATA.groups, first=g[0];
  const total=g.reduce((a,x)=>a+x.n,0), groupsN=g.filter(x=>x.n>0).length;
  const sev=DATA.severity.dep[0], sevTot=sev.reduce((a,b)=>a+b,0);
  const cards=[
    {num:total.toLocaleString('en-US'), lbl:'樣本總人數，分為 '+groupsN+' 個年齡組'},
    {num:first.mean.dep.toFixed(1)+' / '+first.mean.anx.toFixed(1)+' / '+first.mean.str.toFixed(1), lbl:first.label+' 歲組的憂鬱 / 焦慮 / 壓力平均總分（0–42）'},
    {num:((sev[3]+sev[4])/sevTot*100).toFixed(1)+'%', lbl:first.label+' 歲組憂鬱達重度或極重度的比例'}
  ];
  document.getElementById('stats').innerHTML=cards.map(c=>'<div class="stat"><div class="num">'+c.num+'</div><div class="lbl">'+c.lbl+'</div></div>').join('');
})();
</script>
